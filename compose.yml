# familytree auf beikolbs.de – erreichbar nur über Caddy (Netz "proxy")
services:
  web:
    build: .
    image: familytree:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases: [familytree]
    mem_limit: 512m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

volumes:
  db_data:

networks:
  proxy:
    external: true
