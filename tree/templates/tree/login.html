<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – FamilyTree</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a1a2e, #0f3460); min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-lg">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-tree display-4 text-primary"></i>
            <h1 class="h3 fw-bold mt-2">FamilyTree</h1>
            <p class="text-muted small">Privater Familien-Stammbaum</p>
          </div>
          {% if form.errors %}
          <div class="alert alert-danger">Benutzername oder Passwort falsch.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Benutzername</label>
              <input type="text" name="username" class="form-control form-control-lg" autofocus required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Passwort</label>
              <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary btn-lg w-100">
              <i class="bi bi-box-arrow-in-right"></i> Anmelden
            </button>
          </form>
          <p class="text-center text-muted small mt-4">
            Kein Konto? Du benötigst eine Einladung von einem Familienmitglied.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
